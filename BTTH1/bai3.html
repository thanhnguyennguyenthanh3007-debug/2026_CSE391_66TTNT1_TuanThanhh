<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÀI TẬP 03: Sử dụng HTML Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 4px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
        }
        
        table, th, td {
            border: 1px solid #000;
        }
        
        th, td {
            padding: 10px;
            text-align: center;
            font-size: 16px;
        }

        /* In đậm các tiêu đề chính */
        thead tr:first-child th {
            font-size: 18px;
        }

        /* Cột Code và Name căn lề trái nếu muốn giống danh sách */
        td:nth-child(1), td:nth-child(2) {
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th colspan="2" rowspan="2">Student</th>
                    <th colspan="4">Exam</th>
                    <th colspan="4">2nd Exam</th>
                    <th colspan="2" rowspan="2">Final Grade</th>
                </tr>
                <tr>
                    <th>Q1</th>
                    <th>Q2</th>
                    <th>Q3</th>
                    <th rowspan="2">Grade</th> <th>Q1</th>
                    <th>Q2</th>
                    <th>Q3</th>
                    <th rowspan="2">Grade</th> </tr>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>8</th>
                    <th>7</th>
                    <th>5</th>
                    <th>6</th>
                    <th>7</th>
                    <th>8</th>
                    <th>NR</th>
                    <th>R</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>80549061</td>
                    <td>John</td>
                    <td>70%</td>
                    <td>100%</td>
                    <td>100%</td>
                    <td>17.6</td>
                    <td colspan="4"></td> <td>17.6</td>
                    <td>18</td>
                </tr>
                <tr>
                    <td>80549062</td>
                    <td>Mary</td>
                    <td>10%</td>
                    <td>50%</td>
                    <td>50%</td>
                    <td>6.8</td>
                    <td>100%</td>
                    <td>100%</td>
                    <td>50%</td>
                    <td>16.5</td>
                    <td>16.5</td>
                    <td>17</td>
                </tr>
                <tr>
                    <td>80549063</td>
                    <td>Claire</td>
                    <td colspan="4"></td> <td>50%</td>
                    <td>50%</td>
                    <td>50%</td>
                    <td>10.0</td>
                    <td>10.0</td>
                    <td>10</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
